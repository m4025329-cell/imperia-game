<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Империя</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB828C0bapGUHV2HHIWGBOpVA4PdplpJ2Y",
    authDomain: "imperia-game.firebaseapp.com",
    projectId: "imperia-game",
    storageBucket: "imperia-game.firebasestorage.app",
    messagingSenderId: "204004168426",
    appId: "1:204004168426:web:9851446701008e23297d93"
  };

  const app = initializeApp(firebaseConfig);
  window.__db = getFirestore(app);
  window.__docRef = doc;
  window.__getDoc = getDoc;
  window.__setDoc = setDoc;
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg: #05070d;
    --surface: #0e1424;
    --surface-2: #161d33;
    --border: #232b47;
    --gold: #d4af37;
    --gold-light: #fbe58a;
    --gold-dim: #9c7a1e;
    --text: #eef1f8;
    --text-dim: #8b93a7;
    --green: #4a9d6f;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: radial-gradient(circle at 50% 0%, #101a30 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding-bottom: 90px;
  }

  header{
    padding: 20px 18px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom: 1px solid var(--border);
  }

  .brand{
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.5px;
    color: var(--gold-light);
  }

  .level-pill{
    font-size: 11px;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    border-radius: 20px;
    padding: 3px 10px;
    font-weight: 500;
  }

  .capital-block{
    padding: 22px 18px 18px;
    text-align: center;
  }

  .capital-label{
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
  }

  .capital-value{
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 38px;
    color: var(--gold-light);
    letter-spacing: 0.5px;
    transition: transform 0.15s ease;
  }

  .capital-value.pulse{
    transform: scale(1.04);
  }

  .income-rate{
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--green);
  }

  .section-title{
    padding: 18px 18px 10px;
    font-size: 13px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }

  .biz-list{
    display:flex;
    flex-direction:column;
    gap: 10px;
    padding: 0 18px;
  }

  .biz-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display:flex;
    align-items:center;
    gap: 12px;
  }

  .biz-icon{
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--surface-2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 20px;
    flex-shrink:0;
    border: 1px solid var(--border);
  }

  .biz-info{
    flex: 1;
    min-width: 0;
  }

  .biz-name{
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .biz-meta{
    font-size: 12px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }

  .biz-action{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap: 4px;
    flex-shrink:0;
  }

  .buy-btn{
    background: var(--gold);
    color: #1a1300;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
  }

  .buy-btn:disabled{
    background: var(--surface-2);
    color: var(--text-dim);
  }

  .buy-btn.affordable{
    box-shadow: 0 0 0 1px var(--gold-light) inset;
  }

  .biz-level{
    font-size: 11px;
    color: var(--gold);
  }

  nav{
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display:flex;
    padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
  }

  .nav-item{
    flex:1;
    text-align:center;
    font-size: 11px;
    color: var(--text-dim);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 3px;
  }

  .nav-item.active{
    color: var(--gold-light);
  }

  .nav-icon{ font-size: 18px; }

  .overlay{
    position: fixed;
    inset: 0;
    background: rgba(2,3,7,0.85);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 100;
    padding: 20px;
  }

  .overlay-card{
    background: var(--surface);
    border: 1px solid var(--gold-dim);
    border-radius: 18px;
    padding: 28px 24px;
    text-align:center;
    max-width: 320px;
    width: 100%;
  }

  .overlay-icon{ font-size: 32px; margin-bottom: 10px; }

  .overlay-title{
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--gold-light);
    margin-bottom: 8px;
  }

  .overlay-desc{
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }

  .overlay-amount{
    font-family: 'JetBrains Mono', monospace;
    font-size: 30px;
    font-weight: 700;
    color: var(--green);
    margin-bottom: 20px;
  }

  .overlay-btn{
    background: var(--gold);
    color: #1a1300;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    width: 100%;
    cursor: pointer;
  }
</style>
</head>
<body>

  <header>
    <div class="brand">Империя</div>
    <div class="level-pill" id="rankLabel">Новичок</div>
  </header>

  <div class="capital-block">
    <div class="capital-label">Капитал</div>
    <div class="capital-value" id="capitalValue">$0</div>
    <div class="income-rate" id="incomeRate">+$0 / сек</div>
  </div>

  <div id="offlineOverlay" class="overlay" style="display:none">
    <div class="overlay-card">
      <div class="overlay-icon">💰</div>
      <div class="overlay-title">Пока вас не было...</div>
      <div class="overlay-desc" id="offlineDesc">Ваш бизнес продолжал работать</div>
      <div class="overlay-amount" id="offlineAmount">+$0</div>
      <button class="overlay-btn" id="offlineClaim">Забрать</button>
    </div>
  </div>

  <div class="section-title">Твои бизнесы</div>
  <div class="biz-list" id="bizList"></div>

  <nav>
    <div class="nav-item active">
      <div class="nav-icon">◆</div>
      <div>Бизнесы</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">▲</div>
      <div>Рейтинг</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">●</div>
      <div>Профиль</div>
    </div>
  </nav>

<script type="module">
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const userId = tg?.initDataUnsafe?.user?.id || 'guest_' + (localStorage.getItem('guestId') || (()=>{ const id='guest_'+Math.random().toString(36).slice(2); localStorage.setItem('guestId', id); return id; })());

  let capital = 500;

  const businesses = [
    { id:'kiosk', name:'Ларёк с кофе', icon:'☕', baseCost:100, baseIncome:1, level:0 },
    { id:'wash', name:'Автомойка', icon:'🚗', baseCost:600, baseIncome:5, level:0 },
    { id:'cafe', name:'Кафе', icon:'🍽', baseCost:3500, baseIncome:22, level:0 },
    { id:'gym', name:'Фитнес-клуб', icon:'🏋', baseCost:9000, baseIncome:48, level:0 },
    { id:'office', name:'Бизнес-центр', icon:'🏢', baseCost:20000, baseIncome:110, level:0 },
    { id:'hotel', name:'Отель', icon:'🏨', baseCost:55000, baseIncome:290, level:0 },
    { id:'factory', name:'Завод', icon:'⚙', baseCost:120000, baseIncome:650, level:0 },
    { id:'bank', name:'Банк', icon:'🏦', baseCost:400000, baseIncome:2100, level:0 },
    { id:'tech', name:'IT-корпорация', icon:'💻', baseCost:1500000, baseIncome:7800, level:0 },
    { id:'airline', name:'Авиакомпания', icon:'✈', baseCost:6000000, baseIncome:29000, level:0 },
  ];

  async function loadProgress(){
    try{
      const ref = window.__docRef(window.__db, 'players', String(userId));
      const snap = await window.__getDoc(ref);
      if (snap.exists()){
        const data = snap.data();
        capital = data.capital ?? capital;
        (data.businesses || []).forEach(saved=>{
          const b = businesses.find(x=>x.id === saved.id);
          if (b) b.level = saved.level;
        });
        renderAll();
        checkOfflineIncome(data.lastSeen);
      }
    } catch(e){ console.error('Load failed', e); }
  }

  async function saveProgress(){
    try{
      const ref = window.__docRef(window.__db, 'players', String(userId));
      await window.__setDoc(ref, {
        capital,
        businesses: businesses.map(b=>({ id:b.id, level:b.level })),
        lastSeen: Date.now()
      });
    } catch(e){ console.error('Save failed', e); }
  }

  function costFor(biz){
    return Math.round(biz.baseCost * Math.pow(1.15, biz.level));
  }

  function incomePerSec(biz){
    return biz.baseIncome * biz.level;
  }

  function totalIncome(){
    return businesses.reduce((sum,b)=> sum + incomePerSec(b), 0);
  }

  function fmt(n){
    return '$' + Math.floor(n).toLocaleString('ru-RU');
  }

  function renderRank(){
    const inc = totalIncome();
    let label = 'Новичок';
    if (inc >= 500) label = 'Магнат';
    else if (inc >= 100) label = 'Инвестор';
    else if (inc >= 20) label = 'Предприниматель';
    document.getElementById('rankLabel').textContent = label;
  }

  function renderList(){
    const list = document.getElementById('bizList');
    list.innerHTML = '';
    businesses.forEach(biz=>{
      const cost = costFor(biz);
      const affordable = capital >= cost;
      const card = document.createElement('div');
      card.className = 'biz-card';
      card.innerHTML = `
        <div class="biz-icon">${biz.icon}</div>
        <div class="biz-info">
          <div class="biz-name">${biz.name}</div>
          <div class="biz-meta">+${fmt(incomePerSec(biz))}/сек · <span class="biz-level">ур. ${biz.level}</span></div>
        </div>
        <div class="biz-action">
          <button class="buy-btn ${affordable ? 'affordable':''}" ${affordable ? '' : 'disabled'} data-id="${biz.id}">
            ${fmt(cost)}
          </button>
        </div>
      `;
      list.appendChild(card);
    });

    list.querySelectorAll('.buy-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const biz = businesses.find(b=>b.id === btn.dataset.id);
        const cost = costFor(biz);
        if (capital >= cost){
          capital -= cost;
          biz.level += 1;
          if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
          renderAll();
          saveProgress();
        }
      });
    });
  }

  function renderCapital(pulse=false){
    const el = document.getElementById('capitalValue');
    el.textContent = fmt(capital);
    document.getElementById('incomeRate').textContent = `+${fmt(totalIncome())} / сек`;
    if (pulse){
      el.classList.add('pulse');
      setTimeout(()=> el.classList.remove('pulse'), 150);
    }
  }

  function renderAll(){
    renderCapital();
    renderList();
    renderRank();
  }

  renderAll();
  loadProgress();

  function checkOfflineIncome(lastSeen){
    if (!lastSeen) return;
    const secondsAway = Math.min((Date.now() - lastSeen) / 1000, 8 * 3600);
    const earned = Math.floor(totalIncome() * secondsAway * 0.5);
    if (earned > 10){
      capital += earned;
      document.getElementById('offlineAmount').textContent = fmt(earned);
      const hrs = Math.floor(secondsAway/3600), mins = Math.floor((secondsAway%3600)/60);
      document.getElementById('offlineDesc').textContent = `Ваш бизнес работал ${hrs}ч ${mins}м`;
      document.getElementById('offlineOverlay').style.display = 'flex';
      renderAll();
    }
  }

  document.getElementById('offlineClaim').addEventListener('click', ()=>{
    document.getElementById('offlineOverlay').style.display = 'none';
    saveProgress();
  });

  setInterval(saveProgress, 10000);
  document.addEventListener('visibilitychange', ()=>{ if (document.hidden) saveProgress(); });
  window.addEventListener('beforeunload', saveProgress);

  setInterval(()=>{
    const gain = totalIncome();
    if (gain > 0){
      capital += gain;
      renderCapital(true);
      renderList();
      renderRank();
    }
  }, 1000);
</script>

</body>
</html>
